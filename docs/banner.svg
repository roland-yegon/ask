<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="ask — validated user input for C">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#083344"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1000" height="220" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="24" fill="url(#dots)"/>
  <rect x="1" y="1" width="998" height="218" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="2"/>

  <rect x="56" y="52" width="116" height="116" rx="28" fill="url(#accent)"/>
  <path d="M86 84l24 26-24 26" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 136h26" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

  <text x="204" y="132" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">ask</text>
  <text x="208" y="170" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">validated user input for C</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <rect x="626" y="54" width="318" height="112" rx="16" fill="#0b1120" fill-opacity="0.85" stroke="#475569"/>
